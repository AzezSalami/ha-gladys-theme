# Gladys Assistant look & feel for Home Assistant.
# Soft pastel gradient, frosted-glass cards, large radii, dark navy pills, mint green actions.
Gladys:
  # ---- Shared (mode independent) ----
  primary-font-family: '"Inter", "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  paper-font-common-base_-_font-family: var(--primary-font-family)
  paper-font-body1_-_font-family: var(--primary-font-family)
  ha-card-border-radius: 28px
  ha-card-border-width: 1px
  ha-card-backdrop-filter: blur(18px) saturate(1.2)
  ha-button-border-radius: 999px
  ha-dialog-border-radius: 28px
  ha-dialog-surface-backdrop-filter: blur(18px)
  ha-bubble-border-radius: 999px
  ha-tile-icon-border-radius: 14px
  ha-font-family-body: var(--primary-font-family)
  ha-font-family-heading: var(--primary-font-family)
  mdc-shape-medium: 18px
  mdc-shape-large: 28px
  switch-checked-color: var(--primary-color)
  slider-color: var(--primary-color)
  state-icon-color: var(--secondary-text-color)
  state-icon-active-color: var(--gladys-green-text)
  state-active-color: var(--gladys-green-text)
  state-climate-heat-color: "#e8914f"
  state-climate-cool-color: "#5b8fd9"
  warning-color: "#e8a93b"
  info-color: "#5b8fd9"
  label-badge-red: "#d9534f"
  label-badge-green: "#4caf8a"
  label-badge-blue: "#5b8fd9"
  label-badge-yellow: "#e8a93b"

  modes:
    light:
      primary-color: "#12182b"
      dark-primary-color: "#0a0f1e"
      light-primary-color: "#dfe3f0"
      accent-color: "#4caf8a"
      gladys-green-text: "#2f7d5b"
      success-color: "#4caf8a"
      error-color: "#d9534f"
      lovelace-background: "linear-gradient(135deg, #eef2ff 0%, #e9e6f7 45%, #f8e9e4 100%) fixed"
      primary-background-color: "#eef0f9"
      secondary-background-color: "rgba(255, 255, 255, 0.55)"
      primary-text-color: "#161b2e"
      secondary-text-color: "#6b7186"
      disabled-text-color: "#aab0c2"
      text-primary-color: "#ffffff"
      divider-color: "rgba(22, 27, 46, 0.08)"
      outline-color: "rgba(255, 255, 255, 0.7)"
      card-background-color: "rgba(255, 255, 255, 0.55)"
      ha-card-background: "rgba(255, 255, 255, 0.55)"
      ha-card-border-color: "rgba(255, 255, 255, 0.8)"
      ha-card-box-shadow: "0 8px 30px rgba(60, 70, 120, 0.08)"
      app-header-background-color: "rgba(255, 255, 255, 0.6)"
      app-header-text-color: "#161b2e"
      sidebar-background-color: "rgba(240, 243, 252, 0.9)"
      sidebar-text-color: "#4a5068"
      sidebar-icon-color: "#6b7186"
      sidebar-selected-background-color: "#ffffff"
      sidebar-selected-text-color: "#161b2e"
      sidebar-selected-icon-color: "#161b2e"
      table-header-background-color: "rgba(255, 255, 255, 0.6)"
      table-row-background-color: "transparent"
      table-row-alternative-background-color: "rgba(255, 255, 255, 0.35)"
      input-fill-color: "rgba(255, 255, 255, 0.8)"
      input-ink-color: "#161b2e"
      input-label-ink-color: "#6b7186"
      input-idle-line-color: "rgba(22, 27, 46, 0.12)"
      input-dropdown-icon-color: "#6b7186"
      mdc-theme-primary: "#12182b"
      switch-unchecked-color: "#c5cad9"
      switch-unchecked-track-color: "#dfe3ee"
      switch-checked-track-color: "#4caf8a"
      switch-checked-color: "#4caf8a"
      slider-bar-color: "#dfe3ee"
      slider-color: "#12182b"
      paper-slider-container-color: "#dfe3ee"
      paper-listbox-background-color: "#ffffff"
      mdc-ripple-color: "#12182b"
      codemirror-property: "#2f7d5b"
      # tile / chip surfaces
      ha-tile-background: "rgba(255, 255, 255, 0.85)"
      state-active-background: "rgba(76, 175, 138, 0.18)"
    dark:
      primary-color: "#e8ecf8"
      dark-primary-color: "#c9d0e6"
      light-primary-color: "#2a3050"
      accent-color: "#5fc8a0"
      gladys-green-text: "#7fd9b4"
      success-color: "#5fc8a0"
      error-color: "#ef6f6c"
      lovelace-background: "linear-gradient(135deg, #12162a 0%, #1b1a34 45%, #2a1f2e 100%) fixed"
      primary-background-color: "#12162a"
      secondary-background-color: "rgba(255, 255, 255, 0.06)"
      primary-text-color: "#eef0f9"
      secondary-text-color: "#9aa1ba"
      disabled-text-color: "#5c637c"
      text-primary-color: "#12182b"
      divider-color: "rgba(255, 255, 255, 0.08)"
      outline-color: "rgba(255, 255, 255, 0.12)"
      card-background-color: "rgba(255, 255, 255, 0.07)"
      ha-card-background: "rgba(255, 255, 255, 0.07)"
      ha-card-border-color: "rgba(255, 255, 255, 0.12)"
      ha-card-box-shadow: "0 8px 30px rgba(0, 0, 0, 0.25)"
      app-header-background-color: "rgba(255, 255, 255, 0.08)"
      app-header-text-color: "#eef0f9"
      sidebar-background-color: "rgba(18, 22, 42, 0.92)"
      sidebar-text-color: "#c9d0e6"
      sidebar-icon-color: "#9aa1ba"
      sidebar-selected-background-color: "rgba(255, 255, 255, 0.12)"
      sidebar-selected-text-color: "#ffffff"
      sidebar-selected-icon-color: "#ffffff"
      table-header-background-color: "rgba(255, 255, 255, 0.08)"
      table-row-background-color: "transparent"
      table-row-alternative-background-color: "rgba(255, 255, 255, 0.04)"
      input-fill-color: "rgba(255, 255, 255, 0.08)"
      input-ink-color: "#eef0f9"
      input-label-ink-color: "#9aa1ba"
      input-idle-line-color: "rgba(255, 255, 255, 0.15)"
      input-dropdown-icon-color: "#9aa1ba"
      mdc-theme-primary: "#e8ecf8"
      switch-unchecked-color: "#5c637c"
      switch-unchecked-track-color: "#2c3350"
      switch-checked-track-color: "#5fc8a0"
      switch-checked-color: "#5fc8a0"
      slider-bar-color: "#2c3350"
      slider-color: "#e8ecf8"
      paper-slider-container-color: "#2c3350"
      paper-listbox-background-color: "#1b1f38"
      mdc-ripple-color: "#e8ecf8"
      codemirror-property: "#7fd9b4"
      ha-tile-background: "rgba(255, 255, 255, 0.09)"
      state-active-background: "rgba(95, 200, 160, 0.2)"
